<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>สมุดจ่ายบิล</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

  :root{
    --cover:#1F3D3A; --cover-dark:#12211F; --gold:#C9A227; --gold-soft:#E4C874;
    --paper:#FAF6EC; --line:#E3DCC8; --ink:#2B2B26; --ink-muted:#8A8272;
    --overdue:#C1440E; --paid:#3F6B4F;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:"Noto Sans Thai",sans-serif; background:var(--paper); color:var(--ink);}
  .serif{font-family:"Noto Serif Thai",serif;}
  .cover{background:linear-gradient(160deg,var(--cover),var(--cover-dark)); padding:26px 18px 40px;}
  .cover-top{display:flex; align-items:center; gap:10px;}
  .cover-title{color:var(--gold-soft); font-size:21px; font-weight:700;}
  .cover-sub{color:rgba(228,200,116,.55); font-size:11px; letter-spacing:1.5px; text-transform:uppercase;}
  .nav-row{display:flex; align-items:center; justify-content:space-between; margin-top:24px;}
  .nav-btn{background:rgba(255,255,255,.08); border:none; border-radius:999px; padding:8px 12px; color:var(--gold-soft); cursor:pointer; font-size:16px;}
  .month-label{color:#fff; font-size:18px; font-weight:600; text-align:center;}
  .month-tag{color:var(--gold); font-size:11px; margin-top:2px;}
  .summary{margin:-22px 16px 0; background:#fff; border-radius:16px; box-shadow:0 10px 26px rgba(18,33,31,.16); padding:16px 18px; position:relative; z-index:2;}
  .summary-row{display:flex; justify-content:space-between;}
  .stat-label{font-size:10.5px; color:var(--ink-muted); margin-bottom:2px;}
  .stat-value{font-size:15px; font-weight:700;}
  .progress-track{margin-top:12px; height:6px; border-radius:999px; background:var(--line); overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--paid),var(--gold)); transition:width .3s ease;}
  .list-wrap{padding:20px 16px 110px;}
  .empty, .loading{text-align:center; padding:44px 20px; color:var(--ink-muted); font-size:14px;}
  .card{background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(18,33,31,.06); overflow:hidden;}
  .row{display:flex; align-items:center; gap:12px; padding:14px; border-bottom:1px dashed var(--line); position:relative;}
  .row:last-child{border-bottom:none;}
  .row:hover{background:rgba(31,61,58,.03);}
  .icon-circle{width:38px; height:38px; border-radius:10px; background:rgba(31,61,58,.07); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:17px;}
  .icon-circle.paid{background:rgba(63,107,79,.1);}
  .row-name{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-meta{font-size:12px; color:var(--ink-muted); margin-top:1px;}
  .row-meta.overdue{color:var(--overdue);}
  .row-amount{font-size:14.5px; font-weight:700; margin-right:4px; white-space:nowrap;}
  .check-btn{width:32px; height:32px; border-radius:999px; border:1.5px solid var(--line); background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:14px; color:#fff;}
  .check-btn.paid{background:var(--paid); border-color:var(--paid);}
  .del-btn{border:none; background:transparent; color:var(--line); cursor:pointer; padding:4px; flex-shrink:0; font-size:15px;}
  .stamp{position:absolute; left:46px; top:50%; transform:translateY(-50%) rotate(-10deg); border:2px solid var(--paid); color:var(--paid); border-radius:6px; padding:2px 7px; font-size:10.5px; font-weight:700; letter-spacing:1px; opacity:.75; pointer-events:none; mix-blend-mode:multiply;}
  .reset-link{display:block; text-align:center; margin-top:18px; background:none; border:none; color:var(--ink-muted); font-size:12px; text-decoration:underline; cursor:pointer;}
  .fab{position:fixed; bottom:22px; right:20px; width:54px; height:54px; border-radius:999px; background:var(--cover); color:var(--gold); border:none; box-shadow:0 8px 20px rgba(18,33,31,.35); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:26px;}
  .overlay{position:fixed; inset:0; background:rgba(18,33,31,.45); display:none; align-items:flex-end; justify-content:center; z-index:10;}
  .overlay.open{display:flex;}
  .sheet{background:var(--paper); width:100%; max-width:460px; border-radius:18px 18px 0 0; padding:18px 20px 24px; box-shadow:0 -6px 24px rgba(0,0,0,.2);}
  .sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .sheet-title{font-size:17px; font-weight:700; color:var(--cover);}
  .close-btn{border:none; background:none; cursor:pointer; color:var(--ink-muted); font-size:20px;}
  .field{margin-bottom:12px;}
  .field-label{font-size:12px; color:var(--ink-muted); margin-bottom:5px;}
  .field input{width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); font-size:14px; font-family:inherit; background:#fff; color:var(--ink);}
  .two-col{display:flex; gap:10px;}
  .cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .cat-btn{display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px; border-radius:10px; border:1.5px solid var(--line); background:#fff; cursor:pointer;}
  .cat-btn.active{border-color:var(--cover); background:rgba(31,61,58,.06);}
  .cat-btn span{font-size:10.5px; color:var(--ink-muted); text-align:center; line-height:1.2;}
  .cat-btn.active span{color:var(--cover);}
  .submit-btn{width:100%; margin-top:8px; padding:13px 0; border-radius:12px; border:none; background:var(--cover); color:var(--gold); font-size:15px; font-weight:700; cursor:pointer;}
  .err-msg{text-align:center; margin-top:10px; font-size:12px; color:var(--overdue);}
  @keyframes stampIn{0%{opacity:0; transform:translateY(-50%) rotate(-14deg) scale(1.6);}60%{opacity:1;}100%{opacity:.75; transform:translateY(-50%) rotate(-10deg) scale(1);}}
  .stamp.new{animation:stampIn .4s ease-out;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .pay-overlay{position:fixed;inset:0;background:rgba(18,33,31,.45);display:none;align-items:flex-end;justify-content:center;z-index:20;}
  .pay-overlay.open{display:flex;}
  .pay-sheet{background:var(--paper);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:18px 20px 24px;box-shadow:0 -6px 24px rgba(0,0,0,.2);}
  .pay-info{background:#fff;border-radius:12px;padding:12px;margin:10px 0 14px;font-size:13px;}
  .pay-info-row{display:flex;justify-content:space-between;margin:4px 0;}
  .pay-est{color:var(--ink-muted);}
  .pay-input{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:16px;font-family:inherit;background:#fff;color:var(--ink);}
  .pay-date{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  .installment-badge{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:999px;background:rgba(201,162,39,.14);color:#8a6d13;font-size:10px;}

</style>
</head>
<body>

<div class="cover">
  <div class="cover-top">
    <span style="font-size:20px;">📖</span>
    <div>
      <div class="serif cover-title">สมุดจ่ายบิล</div>
      <div class="cover-sub">Bill Passbook</div>
    </div>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" aria-label="เดือนก่อนหน้า">‹</button>
    <div>
      <div class="serif month-label" id="monthLabel">—</div>
      <div class="month-tag" id="currentTag"></div>
    </div>
    <button class="nav-btn" id="nextBtn" aria-label="เดือนถัดไป">›</button>
  </div>
</div>

<div class="summary">
  <div class="summary-row">
    <div><div class="stat-label">ทั้งหมด</div><div class="stat-value" id="statTotal" style="color:var(--ink);">฿0</div></div>
    <div><div class="stat-label">จ่ายแล้ว</div><div class="stat-value" id="statPaid" style="color:var(--paid);">฿0</div></div>
    <div><div class="stat-label">คงเหลือ</div><div class="stat-value" id="statRemain" style="color:var(--ink-muted);">฿0</div></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
</div>

<div class="list-wrap">
  <div id="listArea"></div>
  <button class="reset-link" id="resetBtn" style="display:none;">ล้างข้อมูลบิลทั้งหมด</button>
  <div class="err-msg" id="errMsg" style="display:none;"></div>
</div>

<button class="fab" id="addFab" aria-label="เพิ่มรายการบิล">+</button>

<div class="overlay" id="overlay">
  <form class="sheet" id="billForm">
    <div class="sheet-head">
      <div class="serif sheet-title">เพิ่มรายการบิล</div>
      <button type="button" class="close-btn" id="closeBtn" aria-label="ปิด">✕</button>
    </div>
    <div class="field">
      <div class="field-label">ชื่อบิล</div>
      <input id="fName" placeholder="เช่น บัตรเครดิต KTC, ค่าเน็ต AIS" required />
    </div>
    <div class="two-col">
      <div class="field" style="flex:1;">
        <div class="field-label">จำนวนเงิน (บาท)</div>
        <input id="fAmount" type="number" min="0" step="0.01" placeholder="0.00" required />
      </div>
      <div class="field" style="width:120px;">
        <div class="field-label">ครบกำหนดวันที่</div>
        <input id="fDueDay" type="number" min="1" max="31" value="1" required />
      </div>
    </div>
    <div class="field">
      <div class="field-label">ประเภทบิล</div>
      <div class="two-col">
        <button type="button" class="cat-btn active" id="typeRecurring" style="flex:1;">🔄<span>บิลประจำ</span></button>
        <button type="button" class="cat-btn" id="typeInstallment" style="flex:1;">🧾<span>บิลผ่อน</span></button>
      </div>
    </div>

    <div class="field" id="installmentFields" style="display:none;">
      <div class="two-col">
        <div class="field" style="flex:1;">
          <div class="field-label">เดือนเริ่มผ่อน</div>
          <input id="fStartMonth" type="month" />
        </div>
        <div class="field" style="width:120px;">
          <div class="field-label">จำนวนงวด</div>
          <input id="fInstallments" type="number" min="1" max="120" value="10" />
        </div>
      </div>
    </div>

    <div class="field">
      <div class="field-label">หมวดหมู่</div>
      <div class="cat-grid" id="catGrid"></div>
    </div>
    <button type="submit" class="submit-btn">บันทึกรายการ</button>
  </form>
</div>

<div class="pay-overlay" id="payOverlay">
  <form class="pay-sheet" id="payForm">
    <div class="sheet-head">
      <div class="serif sheet-title">บันทึกการจ่าย</div>
      <button type="button" class="close-btn" id="payCloseBtn" aria-label="ปิด">✕</button>
    </div>
    <div class="pay-info">
      <div class="pay-info-row"><strong id="payBillName">-</strong><strong id="payEstimate">฿0</strong></div>
      <div class="pay-info-row pay-est"><span>ยอดประมาณการ</span><span id="payEstimate2">฿0</span></div>
    </div>
    <div class="field">
      <div class="field-label">ยอดจ่ายจริง (บาท)</div>
      <input id="payAmount" class="pay-input" type="number" min="0" step="0.01" required />
    </div>
    <div class="field">
      <div class="field-label">วันที่จ่ายจริง</div>
      <input id="payDate" class="pay-date" type="date" required />
    </div>
    <button type="submit" class="submit-btn">บันทึกการจ่าย</button>
  </form>
</div>
<script>
/* ===== ตั้งค่าให้ตรงกับของคุณ ===== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzZckDFRcPuOmi3pn6v0433hZW_HUALtdOk2vmS6fsf_xgBruPtwU_FwLDeYTugUF6j/exec';
const TOKEN = '4830203652@Aee'; // ต้องตรงกับ TOKEN ใน Code.gs
/* ================================== */

const CATEGORIES = [
  { id: 'credit', label: 'บัตรเครดิต', icon: '💳' },
  { id: 'phone', label: 'ค่าโทรศัพท์', icon: '📱' },
  { id: 'water', label: 'ค่าน้ำ', icon: '💧' },
  { id: 'electric', label: 'ค่าไฟ', icon: '⚡' },
  { id: 'internet', label: 'อินเทอร์เน็ต', icon: '📶' },
  { id: 'insurance', label: 'ประกัน', icon: '🛡️' },
  { id: 'rent', label: 'ค่าเช่า/ผ่อนบ้าน', icon: '🏠' },
  { id: 'other', label: 'อื่นๆ', icon: '🧾' },
];
const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

let monthDate = new Date(); monthDate.setDate(1);
let bills = [];
let paidMap = {};
let selectedCategory = 'other';
let justStampedId = null;
let payingBillId = null;

const catOf = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length-1];
const monthKeyOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const daysInMonth = (y,m) => new Date(y, m+1, 0).getDate();
const baht = n => Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 });

async function api(action, extraParams) {
  const params = new URLSearchParams({ token: TOKEN, action, ...extraParams });
  const res = await fetch(`${APPS_SCRIPT_URL}?${params.toString()}`);
  if (!res.ok) throw new Error('network error');
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function loadAll() {
  document.getElementById('listArea').innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
  try {
    const data = await api('list');
    bills = Array.isArray(data.bills) ? data.bills : [];
    paidMap = normalizePaidMap(data.paidMap);
    render();
  } catch (e) {
    document.getElementById('listArea').innerHTML = `<div class="loading">โหลดข้อมูลไม่สำเร็จ: ตรวจสอบ APPS_SCRIPT_URL และ TOKEN ในไฟล์นี้<br><span style="font-size:11px;">${e.message}</span></div>`;
  }
}

function normalizePaidMap(raw) {
  const out = {};
  if (!raw || typeof raw !== 'object') return out;

  Object.keys(raw).forEach(monthKey => {
    const value = raw[monthKey];
    out[monthKey] = {};

    // New format: { billId: { paidAmount, paidDate } }
    if (value && !Array.isArray(value) && typeof value === 'object') {
      Object.keys(value).forEach(id => {
        const item = value[id];
        if (item && typeof item === 'object') {
          out[monthKey][String(id)] = {
            paidAmount: Number(item.paidAmount || 0),
            paidDate: item.paidDate ? String(item.paidDate).substring(0, 10) : ''
          };
        }
      });
      return;
    }

    // Old format: [billId, billId, ...]
    if (Array.isArray(value)) {
      value.forEach(id => {
        out[monthKey][String(id)] = { paidAmount: 0, paidDate: '' };
      });
    }
  });

  return out;
}

function render() {
  const monthKey = monthKeyOf(monthDate);
  const dim = daysInMonth(monthDate.getFullYear(), monthDate.getMonth());
  const today = new Date();
  today.setHours(0,0,0,0);

  const isCurrentMonth =
    monthDate.getFullYear() === today.getFullYear() &&
    monthDate.getMonth() === today.getMonth();

  const paidRows = paidMap[monthKey] || {};
  const beYear = monthDate.getFullYear() + 543;

  document.getElementById('monthLabel').textContent =
    `${THAI_MONTHS[monthDate.getMonth()]} ${beYear}`;
  document.getElementById('currentTag').textContent =
    isCurrentMonth ? 'เดือนนี้' : '';

  const currentIndex = monthDate.getFullYear() * 12 + monthDate.getMonth();

  const rows = bills.map(b => {
    let installmentNo = null;
    let installmentTotal = null;

    if (b.type === 'installment') {
      if (!b.startMonth || !b.installments) return null;

      const [sy, sm] = b.startMonth.split('-').map(Number);
      if (!sy || !sm) return null;

      const startIndex = sy * 12 + (sm - 1);
      installmentNo = currentIndex - startIndex + 1;
      installmentTotal = Number(b.installments);

      if (installmentNo < 1 || installmentNo > installmentTotal) return null;
    }

    const day = Math.min(b.dueDay, dim);
    const dueDate = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
    const paidInfo = paidRows[String(b.id)];
    const paid = !!paidInfo;
    const overdue = !paid && isCurrentMonth && dueDate < today;

    return {
      ...b,
      day,
      paid,
      paidAmount: paidInfo ? Number(paidInfo.paidAmount || 0) : 0,
      paidDate: paidInfo ? paidInfo.paidDate : '',
      overdue,
      installmentNo,
      installmentTotal
    };
  }).filter(Boolean).sort((a,b) => a.day - b.day);

  const total = rows.reduce((s,r)=>s+r.amount,0);
  const paidAmt = rows.filter(r=>r.paid).reduce((s,r)=>s+r.paidAmount,0);
  const remain = total - rows.filter(r=>!r.paid).reduce((s,r)=>s+r.amount,0);
  const progress = total > 0 ? paidAmt / total : 0;

  document.getElementById('statTotal').textContent = '฿' + baht(total);
  document.getElementById('statPaid').textContent = '฿' + baht(paidAmt);
  document.getElementById('statRemain').textContent = '฿' + baht(Math.max(remain,0));
  document.getElementById('statRemain').style.color =
    remain > 0 ? 'var(--overdue)' : 'var(--ink-muted)';
  document.getElementById('progressFill').style.width =
    Math.min(Math.round(progress*100),100) + '%';

  const listArea = document.getElementById('listArea');
  const resetBtn = document.getElementById('resetBtn');

  if (rows.length === 0) {
    listArea.innerHTML =
      `<div class="empty">🧾<br>ยังไม่มีรายการบิลในเดือนนี้<br>
      <span style="font-size:13px;">แตะปุ่ม + ด้านล่างเพื่อเพิ่มบิลแรกของคุณ</span></div>`;
    resetBtn.style.display = bills.length ? 'block' : 'none';
    return;
  }

  resetBtn.style.display = bills.length ? 'block' : 'none';

  listArea.innerHTML = `<div class="card">${rows.map(r => {
    const cat = catOf(r.category);
    const typeBadge = r.installmentNo
      ? `<span class="installment-badge">งวด ${r.installmentNo}/${r.installmentTotal}</span>`
      : '';

    const paidText = r.paid
      ? ` · จ่ายจริง ฿${baht(r.paidAmount)}`
      : '';

    return `
      <div class="row">
        <div class="icon-circle ${r.paid ? 'paid' : ''}">${cat.icon}</div>
        <div style="flex:1;min-width:0;">
          <div class="row-name">${escapeHtml(r.name)}${typeBadge}</div>
          <div class="row-meta ${r.overdue ? 'overdue' : ''}">
            ${cat.label} · ครบกำหนดวันที่ ${r.day}
            ${r.overdue ? ' · เลยกำหนดชำระ' : ''}
            ${paidText}
          </div>
        </div>
        <div class="row-amount">
          ฿${baht(r.paid ? r.paidAmount : r.amount)}
        </div>
        <button class="check-btn ${r.paid ? 'paid' : ''}"
          data-toggle="${r.id}"
          aria-label="${r.paid ? 'ดูการจ่าย' : 'บันทึกการจ่าย'}">
          ${r.paid ? '✓' : ''}
        </button>
        <button class="del-btn" data-delete="${r.id}" aria-label="ลบรายการ">🗑</button>
        ${r.paid ? `<div class="stamp ${justStampedId === r.id ? 'new' : ''}">จ่ายแล้ว</div>` : ''}
      </div>`;
  }).join('')}</div>`;

  justStampedId = null;

  listArea.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-toggle');
      const row = rows.find(x => String(x.id) === String(id));
      if (row && row.paid) {
        // ถ้าจ่ายแล้ว กดอีกครั้งให้ยกเลิกการจ่าย
        togglePaid(id);
      } else {
        openPayModal(id);
      }
    });
  });

  listArea.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', () =>
      deleteBill(btn.getAttribute('data-delete'))
    );
  });
}
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function openPayModal(id) {
  const bill = bills.find(b => String(b.id) === String(id));
  if (!bill) return;

  payingBillId = id;
  document.getElementById('payBillName').textContent = bill.name;
  document.getElementById('payEstimate').textContent = '฿' + baht(bill.amount);
  document.getElementById('payEstimate2').textContent = '฿' + baht(bill.amount);
  document.getElementById('payAmount').value = bill.amount;

  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  document.getElementById('payDate').value = `${y}-${m}-${d}`;

  document.getElementById('payOverlay').classList.add('open');
  document.getElementById('payAmount').focus();
}

function closePayModal() {
  document.getElementById('payOverlay').classList.remove('open');
  payingBillId = null;
}

async function savePayment() {
  if (!payingBillId) return;

  const paidAmount = parseFloat(document.getElementById('payAmount').value);
  const paidDate = document.getElementById('payDate').value;

  if (!Number.isFinite(paidAmount) || paidAmount < 0 || !paidDate) return;

  const monthKey = monthKeyOf(monthDate);
  justStampedId = payingBillId;

  try {
    const data = await api('savePayment', {
      monthKey,
      id: payingBillId,
      paidAmount: String(paidAmount),
      paidDate
    });

    bills = data.bills;
    paidMap = data.paidMap;
    closePayModal();
    render();
  } catch (e) {
    showErr(e);
  }
}

async function togglePaid(id) {
  const monthKey = monthKeyOf(monthDate);

  try {
    const data = await api('togglePaid', { monthKey, id });
    bills = data.bills;
    paidMap = data.paidMap;
    render();
  } catch (e) {
    showErr(e);
  }
}
async function deleteBill(id) {
  try {
    const data = await api('deleteBill', { id });
    bills = Array.isArray(data.bills) ? data.bills : []; paidMap = normalizePaidMap(data.paidMap);
    render();
  } catch (e) { showErr(e); }
}

async function resetAll() {
  if (!confirm('ล้างรายการบิลทั้งหมด? การกระทำนี้ย้อนกลับไม่ได้')) return;
  try {
    const data = await api('resetAll');
    bills = Array.isArray(data.bills) ? data.bills : []; paidMap = normalizePaidMap(data.paidMap);
    render();
  } catch (e) { showErr(e); }
}

function showErr(e) {
  const el = document.getElementById('errMsg');
  el.style.display = 'block';
  el.textContent = 'เกิดข้อผิดพลาด: ' + e.message;
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

function buildCatGrid() {
  const grid = document.getElementById('catGrid');
  grid.innerHTML = CATEGORIES.map(c => `
    <button type="button" class="cat-btn ${c.id === selectedCategory ? 'active' : ''}" data-cat="${c.id}">
      <span style="font-size:16px;">${c.icon}</span>
      <span>${c.label}</span>
    </button>`).join('');
  grid.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedCategory = btn.getAttribute('data-cat');
      buildCatGrid();
    });
  });
}

document.getElementById('prevBtn').addEventListener('click', () => { monthDate.setMonth(monthDate.getMonth()-1); render(); });
document.getElementById('nextBtn').addEventListener('click', () => { monthDate.setMonth(monthDate.getMonth()+1); render(); });
document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('addFab').addEventListener('click', () => document.getElementById('overlay').classList.add('open'));
document.getElementById('closeBtn').addEventListener('click', () => document.getElementById('overlay').classList.remove('open'));
document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') e.currentTarget.classList.remove('open'); });

let selectedBillType = 'recurring';

document.getElementById('typeRecurring').addEventListener('click', () => {
  selectedBillType = 'recurring';
  document.getElementById('typeRecurring').classList.add('active');
  document.getElementById('typeInstallment').classList.remove('active');
  document.getElementById('installmentFields').style.display = 'none';
});

document.getElementById('typeInstallment').addEventListener('click', () => {
  selectedBillType = 'installment';
  document.getElementById('typeInstallment').classList.add('active');
  document.getElementById('typeRecurring').classList.remove('active');
  document.getElementById('installmentFields').style.display = 'block';

  if (!document.getElementById('fStartMonth').value) {
    document.getElementById('fStartMonth').value = monthKeyOf(monthDate);
  }
});

document.getElementById('payCloseBtn').addEventListener('click', closePayModal);
document.getElementById('payOverlay').addEventListener('click', e => {
  if (e.target.id === 'payOverlay') closePayModal();
});

document.getElementById('payForm').addEventListener('submit', async e => {
  e.preventDefault();
  await savePayment();
});

document.getElementById('billForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('fName').value.trim();
  const amount = parseFloat(document.getElementById('fAmount').value);
  const dueDay = Math.min(Math.max(parseInt(document.getElementById('fDueDay').value)||1,1),31);

  if (!name || !Number.isFinite(amount) || amount < 0) return;

  let startMonth = '';
  let installments = 0;

  if (selectedBillType === 'installment') {
    startMonth = document.getElementById('fStartMonth').value || monthKeyOf(monthDate);
    installments = Math.min(Math.max(parseInt(document.getElementById('fInstallments').value)||1,1),120);
  }

  try {
    const data = await api('addBill', {
      data: encodeURIComponent(JSON.stringify({
        name,
        amount,
        dueDay,
        category: selectedCategory,
        type: selectedBillType,
        startMonth,
        installments
      }))
    });
    bills = Array.isArray(data.bills) ? data.bills : []; paidMap = normalizePaidMap(data.paidMap);
    document.getElementById('billForm').reset();
    document.getElementById('fDueDay').value = 1;
    document.getElementById('fStartMonth').value = '';
    document.getElementById('fInstallments').value = 10;
    selectedCategory = 'other';
    selectedBillType = 'recurring';
    document.getElementById('typeRecurring').classList.add('active');
    document.getElementById('typeInstallment').classList.remove('active');
    document.getElementById('installmentFields').style.display = 'none';
    buildCatGrid();
    document.getElementById('overlay').classList.remove('open');
    render();
  } catch (e) { showErr(e); }
});

buildCatGrid();
loadAll();
</script>



</body>
</html>
